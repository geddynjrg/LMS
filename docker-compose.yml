name: uwezo-lms

services:
  # Laravel LMS Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: uwezo-lms-app
    container_name: uwezo-lms-app
    restart: unless-stopped
    # uploads.ini is bind-mounted; do not cp (same-file error would crash the container)
    command: ["apache2-foreground"]
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./.docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - ./.docker/vhost.conf:/etc/apache2/sites-available/000-default.conf:ro
    ports:
      - "8082:80"
    depends_on:
      redis:
        condition: service_started
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-true}
      - APP_URL=${APP_URL:-http://localhost:8082}
      # IMPORTANT: Use the container name of the existing DB (must be on same network)
      - DB_HOST=uwezo-lms-db
      - DB_PORT=3306
      - DB_DATABASE=uwezo_fund03
      - DB_USERNAME=uwezo_admin
      - DB_PASSWORD=ENj7uhXIxjG7BDHjCqM0bGDSN
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - MAIL_HOST=${MAIL_HOST:-mail.govmail.ke}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-loans@uwezo.go.ke}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Uwezo Fund}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    extra_hosts:
      - "uwezo.ddev.site:host-gateway"
      - "ddev-drupal.ddev.site:host-gateway"
    networks:
      - uwezo-network
      - ddev_bridge

  # Redis — sessions, cache, and Horizon queues depend on this service
  redis:
    image: redis:alpine
    container_name: uwezo-lms-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uwezo-network

  # Laravel Horizon
  horizon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: uwezo-lms-horizon
    command: php artisan horizon
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    depends_on:
      - redis
      - app
    env_file:
      - .env
    environment:
      - DB_HOST=uwezo-lms-db
      - DB_PORT=3306
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - MAIL_HOST=${MAIL_HOST:-mail.govmail.ke}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-loans@uwezo.go.ke}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Uwezo Fund}
    networks:
      - uwezo-network
      - ddev_bridge

  scheduler:
    build: .
    container_name: uwezo-lms-scheduler
    command: php artisan schedule:work
    restart: unless-stopped
    volumes:
      - .:/var/www/html
    depends_on:
      - redis
      - app
    environment:
      - DB_HOST=uwezo-lms-db
      - DB_PORT=3306
    networks:
      - uwezo-network

networks:
  uwezo-network:
    external: true   # Use existing network (we created it manually)
    name: uwezo-network
  ddev_bridge:
    external: true
    name: uwezo_default